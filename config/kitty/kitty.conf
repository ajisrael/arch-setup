# bash is the login shell (TTY1), kitty overrides to zsh so the interactive
# experience is zsh regardless of $SHELL. See AGENTS.md.
shell /usr/bin/zsh

# Background matches waybar's frosted pill (rgba(26, 27, 38, 0.75)):
# same Tokyo Night deep indigo, same 75% opacity. Hyprland's global blur
# frosts whatever sits behind the terminal.
background_opacity 0.75
scrollback_lines 10000
cursor_blink_interval 0

# Nerd font for the prompt's icons (MesloLGS NF, from system-packages.nix AUR).
font_family MesloLGS NF
font_size 12.0

# ---- Tokyo Night ----
# Canonical tokyonight palette; the green/cyan/yellow slots map straight onto
# the Bulbasaur/Piplup/campfire accents used across hyprland + waybar.

# base16 tokyonight-night
background      #1a1b26
foreground      #c0caf5
selection_background #33467c
selection_foreground #c0caf5
cursor          #c0caf5
cursor_text_color #1a1b26
url_color       #7aa2f7

# normal
color0 #15161e
color1 #f7768e
color2 #9ece6a
color3 #e0af68
color4 #7aa2f7
color5 #bb9af7
color6 #7dcfff
color7 #a9b1d6

# bright
color8  #414868
color9  #f7768e
color10 #9ece6a
color11 #e0af68
color12 #7aa2f7
color13 #bb9af7
color14 #7dcfff
color15 #c0caf5
