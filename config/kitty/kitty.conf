# Always use zsh even if the login session's $SHELL is stale (e.g. started
# before chsh). kitty's shell option defaults to $SHELL otherwise.
shell /usr/bin/zsh
background_opacity 0.95
scrollback_lines 10000
cursor_blink_interval 0

# Nerd font for the prompt's icons (MesloLGS NF, from system-packages.nix AUR).
font_family MesloLGS NF
font_size 9.0
