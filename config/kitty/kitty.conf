# bash is the login shell (TTY1), kitty overrides to zsh so the interactive
# experience is zsh regardless of $SHELL. See AGENTS.md.
shell /usr/bin/zsh
background_opacity 0.95
scrollback_lines 10000
cursor_blink_interval 0

# Nerd font for the prompt's icons (MesloLGS NF, from system-packages.nix AUR).
font_family MesloLGS NF
font_size 9.0
