# actkbd bindings for the MacBook Pro 12,1 keyboard backlight (archeus).
#
# applespi translates F5/F6 to KEY_KBDILLUMDOWN (229) / KEY_KBDILLUMUP (230)
# (see linux include/uapi/linux/input-event-codes.h). No in-kernel handler
# consumes these, so actkbd steps the SMC keyboard backlight instead.
#
# Format per line: <keys>:<events>:<attributes>:<command>
#   - events: key (press), rep (repeat), rel (release); empty defaults to key
#   - attributes: empty list means "run the command via system()"
#   - trailing '&' keeps actkbd non-blocking
#
# The F5/F6 events still reach libinput/Hyprland unchanged; nothing there is
# bound to these keys, so nothing double-fires.

229:key::/usr/local/bin/kbd-backlight-step down &
230:key::/usr/local/bin/kbd-backlight-step up &
