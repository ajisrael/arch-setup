# hypridle: staged idle pipeline (lock -> dpms off -> suspend)
#
# Mirror of Omarchy's idle service staging (screensaver -> lock -> suspend),
# implemented for the stock hypridle + hyprlock stack.
#
# Stage 1 (5 min idle): lock the screen. Runs through loginctl so any lock
#   trigger - idle timeout OR sleep (lid close / suspend) - funnels through the
#   same path and hypridle's lock_cmd launches hyprlock.
# Stage 2 (5:30): DPMS off; the monitor is already covered by hyprlock, this is
#   purely power saving. on-resume brings it back so a wake never shows a black
#   panel behind the lock.
# Stage 3 (15 min): suspend (logind handles the lid-close path separately;
#   this is the timeout-based path). before_sleep_cmd re-locks first so the
#   screen is never unprotected at the moment the machine sleeps.
#
# The pidof guard in lock_cmd keeps hyprlock idempotent: if something else
# already locked (e.g. the Super+Shift+L bind), we don't stack a second
# instance.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 900
    on-timeout = systemctl suspend
}
